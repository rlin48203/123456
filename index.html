<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5f57e8" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>每日单词训练</title>
</head>
<body>
  <main style="max-width:720px;margin:40px auto;font-family:system-ui;padding:20px">
    <h1>📚 每日单词训练</h1>
    <p>先开启通知，之后我们再接入每天 09:30 的后台 Push。</p>
    <button id="enable" style="padding:12px 18px;border:0;border-radius:10px;background:#5f57e8;color:#fff;font-size:16px">🔔 开启每日提醒</button>
    <p id="status"></p>
  </main>
  <script>
    const status = document.getElementById('status');
    const button = document.getElementById('enable');
    // We intentionally leave this empty until your VAPID public key is generated.
    const VAPID_PUBLIC_KEY = '';
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      return Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    }
    async function enablePush() {
      if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
        status.textContent = '当前浏览器不支持 Web Push。';
        return;
      }
      if (!VAPID_PUBLIC_KEY) {
        status.textContent = '⏳ Push 正在配置中：还差 VAPID 公钥。';
        return;
      }
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        status.textContent = '你还没有允许通知，请在浏览器设置中允许此网站通知。';
        return;
      }
      const registration = await navigator.serviceWorker.ready;
      const existing = await registration.pushManager.getSubscription();
      const subscription = existing || await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
      localStorage.setItem('pushSubscription', JSON.stringify(subscription));
      status.textContent = '✅ 通知权限已开启，Push 订阅已保存到本机。';
    }
    button.addEventListener('click', enablePush);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {
      status.textContent = 'Service Worker 注册失败，请确认使用 HTTPS 打开。';
    });
  </script>
</body>
</html>
